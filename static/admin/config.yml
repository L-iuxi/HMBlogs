backend:
  name: github
  repo: L-iuxi/HMBlogs
  branch: main
  base_url: https://decapcms.org
  auth_endpoint: /oauth/authorize

media_folder: "static/images"
public_folder: "/HMBlogs/images"

collections:
  - name: "posts"
    label: "八股文章"
    label_singular: "文章"
    folder: "content/posts"
    path: "{{category}}/{{slug}}"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "分类", name: "category", widget: "select", options: ["go", "java", "redis", "mysql", "os", "network", "distributed"] }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "作者", name: "author", widget: "string", required: false, default: "" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "显示目录", name: "table-of-contents", widget: "boolean", default: true }
      - { label: "目录自动编号", name: "toc-auto-numbering", widget: "boolean", default: false }
      - { label: "题图", name: "title-images", widget: "list", required: false, default: [] }
      - { label: "尾图", name: "ending-images", widget: "list", required: false, default: [] }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "sidebar"
    label: "侧边栏"
    files:
      - label: "侧边栏配置"
        name: "sidebar_index"
        file: "content/sidebar/_index.md"
        fields:
          - { label: "链接列表", name: "links", widget: "list", fields: [
              { label: "名称", name: "name", widget: "string" },
              { label: "链接", name: "link", widget: "string" }
            ]}
      - label: "简介"
        name: "sidebar_bio"
        file: "content/sidebar/bio.md"
        fields:
          - { label: "内容", name: "body", widget: "markdown" }
      - label: "基本信息"
        name: "sidebar_info"
        file: "content/sidebar/basic-info.md"
        fields:
          - { label: "内容", name: "body", widget: "markdown" }

  - name: "welcome"
    label: "欢迎页头"
    files:
      - label: "欢迎页头"
        name: "welcome_header"
        file: "content/welcome-header/_index.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "介绍（每行一条）", name: "intro", widget: "list" }
          - { label: "列表名称", name: "list_name", widget: "string" }
          - { label: "列表项", name: "list_items", widget: "list" }
