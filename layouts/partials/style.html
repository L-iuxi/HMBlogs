<style>
{{ $themeName := .Site.Params.theme }}
{{ $theme := index (where .Site.Data.themes "name" $themeName) 0 }}
{{ $custom_themes := (index .Site.Data "custom_themes") }}
{{ if $custom_themes }}
    {{ if not $theme }}
        {{ $theme = index (where $custom_themes "name" $themeName) 0 }}
    {{ end }}
{{ end }}

:root {
    --site-bg: url("{{ (index $theme "site-bg") | absURL }}");
    --accent-color: {{ index $theme "accent-color" }};
    --select-color: {{ index $theme "select-color" }};
    --link-color: {{ index $theme "link-color" }};
    --bg-color: {{ index $theme "bg-color" }};
    --text-color: {{ index $theme "text-color" }};
    --bg-color2: {{ index $theme "bg2-color" }};
    --border-color: {{ index $theme "border-color" }};
    --special-text-color: {{ index $theme "special-text-color" }};
    --post-header-color: {{ index $theme "post-header-color" }};
    --post-shadow-color: {{ index $theme "post-shadow-color" }};
    --outline-color: {{ index $theme "post-outline-color" }};
    --outline-color2: {{ index $theme "post-outline-color2" }};
    --list-style-type: "{{ (index $theme "list-style").type}}";
    --list-style-image: url("{{ ((index $theme "list-style").image) | absURL }}");
}

{{ range .Site.Data.custom_themes }}
:root[data-theme="{{ .name }}"] {
    {{ if (index . "site-bg") }}
    --site-bg: url("{{ (index . "site-bg") | absURL }}");
    {{ else }}
    --site-bg: none;
    {{ end }}
    --accent-color: {{ index . "accent-color" }};
    --select-color: {{ index . "select-color" }};
    --link-color: {{ index . "link-color" }};
    --bg-color: {{ index . "bg-color" }};
    --text-color: {{ index . "text-color" }};
    --bg-color2: {{ index . "bg2-color" }};
    --border-color: {{ index . "border-color" }};
    --special-text-color: {{ index . "special-text-color" }};
    --post-header-color: {{ index . "post-header-color" }};
    --post-shadow-color: {{ index . "post-shadow-color" }};
    --outline-color: {{ index . "post-outline-color" }};
    --outline-color2: {{ index . "post-outline-color2" }};
    --list-style-type: "{{ (index . "list-style").type }}";
    --list-style-image: url("{{ ((index . "list-style").image) | absURL }}");
}
{{ end }}

* {
    box-sizing: border-box;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

@-moz-document url-prefix() {
    * {
        scrollbar-width: thin;
        scrollbar-color: var(--accent-color) #00000000;
    }
}

::-webkit-scrollbar {
    height: 8px;
    width: 8px;
    background: #00000000;
}

::-webkit-scrollbar-thumb {
    background: var(--accent-color);
    -webkit-border-radius: .3rem;
    -webkit-box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.75);
}

::-webkit-scrollbar-corner {
    background: #000;
}

::selection {
    background: var(--select-color);
    color: var(--border-color);
}

body {
    background-color: var(--bg-color);
    background-image: var(--site-bg);
    margin: 0;
    font-size: 14px;
    color: var(--text-color);
}

p {line-height: 1.5em;}

div.tags {
    display: block;
    width: 100%;
    text-align: center;
    margin: .5rem 0;
}

div.tags > p.tags {
    text-align: center;
    margin-bottom: 0;
    font-weight: bold;
    text-transform: uppercase;
}

div.tags > a {
    margin-top: .5rem;
}

h1 {
    font-size: 1.5em;
    color: var(--post-header-color);
    filter: drop-shadow(2px 0 0 var(--outline-color)) drop-shadow(0 2px 0 var(--outline-color)) drop-shadow(-2px 0 0 var(--outline-color)) drop-shadow(0 -2px 0 var(--outline-color))drop-shadow(0 1px 1px var(--outline-color2)) drop-shadow(1px 0 1px var(--outline-color2));
}

h4,
h5,
h6 {color: var(--special-text-color);}

header {
    background-size: 100%;
    background-position: center;
    min-height: 80px;
    margin: 0 0;
    align-content: center;
}

header > h1 {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    margin: 0 auto;
    font-size: 2em;
/*uncomment this line if you want the header text to not take up the full length of the div*/
    /* width: fit-content; */
    max-width: 48rem;
    padding: 6px 12px;
    border-radius: 1em;
    border: 4px double var(--outline-color);
    filter: none;
    text-align: center;
}

ul.pagination {
    display: flex;
    justify-content: center;
    padding: 0;
}


ul.tags {
    margin: 0;
    padding: 0;
    text-align: center;
    justify-content: center;
}

ul.tags li {
    display: inline-block;
    margin: 0 .2rem;
}

ul.tags li a {
    text-decoration: none;
    font-weight: bold;
    text-transform: uppercase;
}

li.page-item {
    list-style: none;
}

li.page-item a{
    display: inline-flex;
    font-size: 1rem;
    margin: .2rem;
    background-color: var(--bg-color2);
    color: var(--text-color);
    padding: 1em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    margin-bottom: 1em;
    box-shadow: var(--post-shadow-color) 5px 5px;

    text-decoration: none;
    user-select: none;
}

li.page-item.active a{
    color: var(--accent-color);
    border-color: var(--accent-color);
}

li.page-item.disabled a{
    cursor: not-allowed;
}

li.page-item:not(.disabled):not(.active) a:hover{
    background-color: var(--select-color);
    color: var(--accent-color);
    border-color: var(--accent-color);
}

li {
    {{ if (index $theme "list-style").image }}
        list-style-image: var(--list-style-image);
    {{ else }}
        list-style-type: var(--list-style-type);
    {{ end }}
}

nav {margin: 1em;}

nav.links > ul {
    max-width: 960px;
    margin: auto;
    line-height: 3rem;
    list-style-type: none;
    padding-left: 0;
    justify-content: space-evenly;
}

nav.links li {
    text-align: center;
    list-style-image: none;
    list-style-type: none;
}

nav.links li > a {
    font-weight: bold;
    background-color: var(--bg-color);
    border: 4px double var(--outline-color);
    padding: .5em 3em;
    text-decoration: none;
}

nav.links li > a:visited {color: var(--link-color);}
nav.links li > a:hover {
    color: var(--accent-color);
    background-color: var(--select-color);
}

nav.languages {
    margin: .3em;
    text-align: center;
}


nav.languages ul {
    display: inline-block;
}

nav.languages ul li {
    display: inline-block;
}

a {
    color: var(--link-color);
    border-radius: .3em;
    transition: .2s ease-out;
}

a:visited {
    color: var(--text-color);
}

a:hover {
    color: var(--accent-color);
    border-color: var(--accent-color);
    transition: .2s ease;
}

#sidebar {
    background-color: var(--bg-color2);
    color: var(--special-text-color);
    height: fit-content;
    min-width: 320px;
    margin-top: 1em;
    margin-right: 2em;
    border-radius: .5em;
}

.small-box {
    max-width: 300px;
    margin: auto;
    border: 4px solid var(--accent-color);
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1.8rem;
    padding: .4em;
}

#avatar {
    margin: .5em;
    max-width: 320px;
}

/*flower shape generated from here: https://css-generators.com/flower-shapes/ */
.flower {
    width: 300px; 
    aspect-ratio: 1;
    {{ with .Site.GetPage "section" "/sidebar/_index.md" }}
    {{ if index .Params "icon-use-flower-shape" }}
        --g:/37.02% 37.02% radial-gradient(#000 calc(71% - 1px),#0000 71%) no-repeat;
        mask: 90.078% 79.895% var(--g),33.953% 97.355% var(--g),0.004% 49.372% var(--g),35.148% 2.257% var(--g),90.817% 21.121% var(--g),radial-gradient(100% 100%,#000 25.476%,#0000 calc(25.476% + 1px));
    {{ else }}
        border-radius: 14px;
    {{ end }}
    {{ end }}
}

#bio {
    margin: 20px;
    padding: .2em;
    background: var(--bg-color);
    border: 4px double var(--bg-color2);
    border-radius: 2em;
    font-size: small;
}

#bio p { margin: 1em; }

#content {
    display: flex;
    max-width: 960px;
    margin: auto;
}

main {
    padding: 1em;
    padding-top: 0;
}

#top {
    background-color: var(--bg-color);
}

#top section {
    background-color: var(--bg-color2);
    border-radius: .5em;
    margin-bottom: 10px;
    padding: .5em 1em;
    width: 100%;
}

article {
    background-color: var(--bg-color2);
    padding: 1em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    margin-bottom: 1em;
    box-shadow: var(--post-shadow-color) 5px 5px;
}
article img {
    max-width: 100%;
}

.readmore summary {
    font-weight: bold;
    color: var(--special-text-color);
    list-style: none;
    cursor: pointer;
}

header h1 a {
    cursor: pointer;
    text-decoration: none;
    color: var(--special-text-color);
}

header h1 a:visited {
    color: inherit;
}

header h1 a:hover {
    color: inherit;
}

.readmore div {
    display: inline;
}

.readmore div p {
    display: block;
}

.read-more-btn {
    display: inline;
    cursor: pointer;
    margin-left: 4px;
    color: var(--link-color);
    text-decoration: underline;
}

.readmore summary::-webkit-details-marker {
  display: none;
}

.readmore[open] > summary {
    border-bottom: 2px dashed var(--bg-color);
    padding-bottom: .6em;
    margin-bottom: .6em;
}

.post-header {
    color: var(--special-text-color);
    font-weight: bold;
    padding: .5rem 0;
    border-bottom: 4px double var(--outline-color);
}

.timestamp {
    font-weight: normal;
    font-size: smaller;
    margin: .2em;
    float: right;
}

.tag-item p {
    font-size: smaller;
}

.photosetx2,
.photosetx3 {
    display: grid;
    gap: 4px;
    align-items: center;
}

.photosetx2 {grid-template-columns: 1fr 1fr;}
.photosetx3 {grid-template-columns: 1fr 1fr 1fr;}

.cropped {
    width: 156px;
    height: 156px;
    overflow: hidden;
    object-position: 25% 25%;
}
.photosetx2 img,
.photosetx3 img {object-fit: cover;}

.center { text-align: center; }

.img-right {
    max-width: 7.5em;
    max-height: 7.5em;
    float: right;
}

.contribution-chart {
    width: 100%;
    height: auto;
    display: block;
}

.clearfix::after {
  content: "";
  clear: both;
  display: table;
}

.small-text {
    font-size: 11px;
    text-shadow: var(--bg-color) 1px 1px;
}

.dropbox-btn {
    color: var(--link-color);
    font-weight: bold;
    background-color: var(--bg-color);
    /* border: 4px double var(--outline-color); */
    border: 1px solid var(--outline-color);
    /* padding: .5em 3em; */
    text-decoration: none;
}

.dropbox-content[visible] {
    display: block;
}

.dropbox-content {
    display: none;
    position: absolute;
    z-index: 1
}

.table-of-contents {
    background-color: var(--bg-color2);
    padding: .3em;
    border: 2px solid var(--border-color);
    border-radius: .3em;
    box-shadow: var(--post-shadow-color) 5px 5px;
}

.table-of-contents.sidebar {
    position: sticky;
    top: 1rem;
    height: fit-content;
    width: 10rem;
    flex-shrink: 0;
    max-height: calc(100vh - 2rem);
    overflow-x: auto;
}

.table-of-contents.float {
    width: max-content;
    max-width: 50vw;
    max-height: 50%;
    overflow: auto;
}

.table-of-contents nav {
    margin: 0 .5em;
}

.table-of-contents nav ul {
    margin: .5em 1em;
    padding: 0;
}

.table-of-contents nav li {
    margin: .3em 0;
}

#single-post {
    display: flex;
    justify-content: center;
    gap: 1rem;
}

#single-post > article {
    max-width: 48rem
}

#single-post > article > #post-toc-mobile {
    display: none;
}

/* these are the mobile styles! */
@media only screen and (max-width: 800px) {
    #content {
        flex-wrap: wrap;
    }
    #sidebar {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        border: none;
        border-radius: 0;
        margin-right: 0;
        margin-bottom: 1em;
        border-radius: .3em;
    }
    header {min-height: 110px;}
    header > h1 { 
        width: fit-content;
        padding: .3em 1em;
    }
    nav.links > ul {
    /* this stuff makes it wrap around on mobile */
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
    }
    #bio {width: 50%;}
    
    #sidebar ul {
        line-height: 2em;
        display: flex;
        flex-wrap: wrap;
        gap: 1em;
    }
    #sidebar > .small-box li {
        margin: .3em 1em;
    }

    #single-post > .table-of-contents.sidebar {
        display: none;
    }

    #single-post > article > #post-toc-mobile {
        display: inline;
    }
}

pre {
    border:1px solid var(--outline-color);
    border-radius:6px;
    padding:0.75rem 1rem;
    margin:1.2rem 0;
    overflow-x:auto;
}

article h2 a,
article h2 a:link,
article h2 a:visited,
article h2 a:hover {
    color: var(--text-color);
    text-decoration: none;
}

#top section ul {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.2em 1em;
}

.theme-switcher {
    display: flex;
    flex-wrap: wrap;
    gap: .5em;
    align-items: center;
    justify-content: center;
    margin: .4em 0;
    float: right;
    margin-left: .6em;
    position: relative;
    z-index: 2;
}

.theme-dot {
    width: 2.6em;
    height: 2.6em;
    border-radius: 50%;
    border: 2px solid var(--border-color);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25em;
    box-shadow: var(--post-shadow-color) 2px 2px;
    transition: transform .15s ease;
}

.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }

.widget {
    text-align: center;
    margin: .3em auto;
}

.clock {
    font-size: 1.7em;
    font-weight: bold;
    color: var(--special-text-color);
    letter-spacing: .05em;
}

.clock-date {
    font-size: .85em;
    color: var(--text-color);
    margin: .2em 0;
}

.weather {
    font-size: 1em;
    color: var(--special-text-color);
}

.rain-layer {
    display: none;
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

:root[data-theme="rain"] .rain-layer { display: block; }

.rain-drop {
    position: absolute;
    top: -12vh;
    background: linear-gradient(to bottom, rgba(100, 150, 225, 0.08), rgba(100, 150, 225, 0.65));
    opacity: var(--o, 0.7);
    animation: rain-fall linear infinite;
}

@keyframes rain-fall {
    0%   { transform: translateY(0) rotate(8deg); opacity: 0; }
    6%   { opacity: var(--o, 0.5); }
    100% { transform: translateY(122vh) rotate(8deg); opacity: 0; }
}

.splash {
    position: absolute;
    bottom: 40px;
    width: 2px;
    height: 2px;
    pointer-events: none;
    transform: translateX(-50%);
}

/* 外环：各边深浅不一、略不规则 */
.splash::before {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 7px;
    height: 2px;
    margin-left: -3.5px;
    border-radius: 46% 54% 50% 50% / 55% 45% 55% 45%;
    border: 1px solid transparent;
    border-top-color: rgba(255, 255, 255, var(--a1, 0.55));
    border-right-color: rgba(120, 170, 235, var(--a2, 0.12));
    border-bottom-color: rgba(60, 115, 210, var(--a3, 0.5));
    border-left-color: rgba(100, 155, 230, var(--a4, 0.22));
    transform: rotate(var(--rot, 0deg));
    animation: splash-ripple 0.85s ease-out forwards;
}

/* 内环：更小更淡、稍晚出现 */
.splash::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 4px;
    height: 1.2px;
    margin-left: -2px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.4);
    border-bottom-color: rgba(70, 125, 215, 0.3);
    opacity: 0;
    animation: splash-ripple-inner 0.7s ease-out 0.12s forwards;
}

/* 飞溅的小水粒 */
.splash i {
    position: absolute;
    left: 0;
    bottom: 0;
    width: var(--s, 2px);
    height: var(--s, 2px);
    margin-left: calc(var(--s, 2px) / -2);
    border-radius: 50%;
    background: var(--c, rgba(90, 145, 225, 0.7));
    opacity: 0;
    animation: splash-x var(--t, 0.55s) linear forwards, splash-y var(--t, 0.55s) forwards;
}

@keyframes splash-ripple {
    0%   { scale: 0.4; opacity: 0.7; }
    100% { scale: 4.5; opacity: 0; }
}

@keyframes splash-ripple-inner {
    0%   { scale: 0.4; opacity: 0.6; }
    100% { scale: 3; opacity: 0; }
}

@keyframes splash-x {
    from { translate: 0 0; }
    to   { translate: var(--dx, 0px) 0; }
}

@keyframes splash-y {
    0%   { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    45%  { transform: translateY(calc(var(--dy, 12px) * -1)); opacity: 1; animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    100% { transform: translateY(2px); opacity: 0; }
}

.puddle {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 260px;
    background: linear-gradient(to top, rgba(96,165,250,.32) 0%, rgba(110,175,250,.22) 25%, rgba(130,190,250,.12) 55%, rgba(160,210,252,.04) 85%, transparent 100%);
    border-top: none;
    box-shadow: none;
}

.cloud-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 75vh;
    background: linear-gradient(to bottom, rgba(85,105,138,.50) 0%, rgba(105,128,162,.36) 30%, rgba(130,155,190,.20) 60%, rgba(170,195,225,.07) 85%, transparent 100%);
    overflow: hidden;
}
.cloud-layer::before, .cloud-layer::after {
    content: '';
    position: absolute;
    top: -8vh; left: -20%;
    width: 140%; height: 56vh;
    background:
        radial-gradient(ellipse 380px 140px at 15% 50%, rgba(65,85,118,.38), transparent 70%),
        radial-gradient(ellipse 520px 170px at 45% 40%, rgba(75,95,128,.36), transparent 70%),
        radial-gradient(ellipse 440px 150px at 78% 55%, rgba(65,85,118,.38), transparent 70%);
    animation: cloud-drift 60s ease-in-out infinite alternate;
}
.cloud-layer::after {
    top: -4vh;
    opacity: .7;
    animation-duration: 90s;
    animation-direction: alternate-reverse;
}
@keyframes cloud-drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }

body > main { position: relative; z-index: 1; }

/* ===== 磨砂玻璃：文章页文字框 ===== */
#single-post article,
#content article,
.book,
#sidebar,
.table-of-contents {
    background-color: color-mix(in srgb, var(--bg-color2) 55%, transparent);
    background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05) 60%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 1rem;
    box-shadow: 0 12px 40px color-mix(in srgb, var(--text-color) 28%, transparent),
                0 2px 8px color-mix(in srgb, var(--text-color) 15%, transparent),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

#single-post article {
    line-height: 1.9;
    letter-spacing: 0.04em;
}

#single-post article p,
#single-post article li {
    line-height: 1.9;
}

#single-post article pre,
#single-post article code {
    letter-spacing: normal;
    line-height: 1.5;
}

/* ===== 雨天：玻璃上滑落的水珠 ===== */
#single-post article,
#content article,
#sidebar { position: relative; }

.glass-drops {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
    z-index: 2;
}

:root[data-theme="rain"] .glass-drops { display: block; }

.glass-drop {
    position: absolute;
    top: -6%;
    width: var(--w, 7px);
    height: calc(var(--w, 7px) * var(--k, 1.6));
    border-radius: var(--br, 50% 50% 48% 52% / 38% 42% 58% 62%);
    transform: rotate(var(--rot, 0deg));
    -webkit-backdrop-filter: blur(1.8px) saturate(120%);
    backdrop-filter: blur(1.8px) saturate(120%);
    background: radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.75) 0 10%, rgba(255,255,255,.14) 34%, rgba(150,190,240,.06) 75%);
    box-shadow: inset -1px -2px 3px rgba(60,100,170,.16), inset 1px 1px 2px rgba(255,255,255,.55), 0 1px 3px rgba(40,80,150,.18);
    opacity: 0;
    animation: glass-slide var(--dur, 60s) linear infinite;
    animation-delay: var(--delay, 0s);
}

.glass-drop::before {
